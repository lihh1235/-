services:
  # PostgreSQL 数据库
  - type: pserv
    name: question-bank-db
    plan: free
    ipAllowList: []

  # 后端 Spring Boot 服务
  - type: web
    name: question-bank-api
    plan: free
    env: java
    buildCommand: |
      bash ../render-build.sh && cd backend && mvn clean package -DskipTests
    startCommand: |
      ./init-db.sh && java -jar backend/target/question-bank-0.0.1-SNAPSHOT.jar
    healthCheckPath: /api/auth/login
    envVars:
      - key: DB_URL
        fromDatabase:
          name: question-bank-db
          property: connectionString
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: DB_USERNAME
        fromDatabase:
          name: question-bank-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: question-bank-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: JAVA_VERSION
        value: 8

  # 前端静态站点
  - type: web
    name: question-bank-web
    plan: free
    env: static
    buildCommand: |
      cd frontend && npm install && npm run build
    publishDirectory: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VUE_APP_API_BASE
        sync: false
